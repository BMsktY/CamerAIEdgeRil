<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deteksi Objek AI - Meja, Laptop, Phone, Clock, dll.</title>

    <!-- Mencegah error favicon.ico 404 -->
    <link rel="icon" href="data:,">

    <!-- CDN TensorFlow.js & Model COCO-SSD -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3"></script>

    <style>
        :root {
            --bg-card: #1e1e1e;
            --border: #333333;
            --text-main: #ffffff;
            --text-muted: #aaaaaa;
            --primary: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #121212;
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 640px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* Status Badges */
        .status-container {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .status-badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            text-align: center;
        }

        .status-badge.online { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .status-badge.demo { background-color: #fff3cd; color: #856404; border: 1px solid #ffeeba; }

        /* Camera Stack Container (Layer 1, 2, 3) */
        #camera-container {
            position: relative;
            width: 100%;
            height: 380px;
            background: #000000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
        }

        /* Layer 1: Stream Video */
        #video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Layer 2: Bounding Box Canvas */
        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        /* Layer 3: Overlay Loading/Error */
        #overlay-msg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            z-index: 5;
            gap: 10px;
            text-align: center;
            padding: 20px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #ffffff;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Control Buttons */
        .controls {
            display: flex;
            gap: 10px;
        }

        button {
            flex: 1;
            padding: 12px;
            font-size: 15px;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-start { background-color: #28a745; color: white; }
        .btn-start:hover:not(:disabled) { background-color: #218838; }

        .btn-stop { background-color: #dc3545; color: white; }
        .btn-stop:hover:not(:disabled) { background-color: #c82333; }

        .btn-ai { background-color: #17a2b8; color: white; }
        .btn-ai:hover:not(:disabled) { background-color: #138496; }

        .btn-danger { background-color: #dc3545; color: white; }
        .btn-success { background-color: #28a745; color: white; }

        /* Log Section UI */
        #data-section {
            flex: 1;
            background: var(--bg-card);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid var(--border);
            min-height: 180px;
            max-height: 250px;
        }

        #data-header {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            font-weight: 700;
            font-size: 14px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            justify-content: space-between;
        }

        #data-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }

        .log-item {
            padding: 10px 12px;
            background: #2a2a2a;
            border-radius: 8px;
            margin-bottom: 8px;
            border-left: 4px solid var(--primary);
            font-size: 13px;
        }

        .log-item .time {
            color: var(--text-muted);
            font-size: 11px;
            display: block;
            margin-bottom: 4px;
        }

        .log-item .items {
            font-weight: 600;
            color: var(--text-main);
        }

        .empty-state {
            text-align: center;
            color: var(--text-muted);
            padding: 30px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Badges Status -->
        <div class="status-container">
            <div id="db-status" class="status-badge demo">DB: DEMO MODE</div>
            <div id="ai-status" class="status-badge demo">AI: MEMUAT MODEL...</div>
        </div>

        <!-- Camera Stack Container -->
        <div id="camera-container">
            <!-- Layer 1: Video -->
            <video id="video" autoplay playsinline muted></video>

            <!-- Layer 2: Canvas -->
            <canvas id="canvas"></canvas>

            <!-- Layer 3: Overlay Loading -->
            <div id="overlay-msg">
                <div class="spinner"></div>
                <p id="overlay-text">Memuat Model AI (COCO-SSD)...</p>
                <small id="overlay-subtext">Mengunduh bobot model. Mohon tunggu.</small>
            </div>
        </div>

        <!-- Tombol Kontrol Kamera & AI -->
        <div class="controls">
            <button class="btn-start" id="btn-start">Nyalakan Kamera</button>
            <button class="btn-stop" id="btn-stop">Matikan Kamera</button>
        </div>
        <div class="controls">
            <button class="btn-ai" id="btn-ai" disabled>Start AI</button>
        </div>

        <!-- Log UI Deteksi Real-time -->
        <div id="data-section">
            <div id="data-header">
                <span>Detected Objects Log</span>
                <span id="log-count">0 items</span>
            </div>
            <div id="data-list">
                <div class="empty-state">Menunggu deteksi objek...</div>
            </div>
        </div>
    </div>

    <!-- SCRIPT FIREBASE & OBJECT DETECTION AI -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, collection, addDoc, query, orderBy, limit, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        // ==========================================
        // 1. CLASS MOCK FIRESTORE (OFFLINE FALLBACK)
        // ==========================================
        class MockFirestore {
            constructor() {
                this.data = JSON.parse(localStorage.getItem('mock_inventory_db') || '[]');
                this.listeners = [];
            }

            collection() { return this; }

            async add(payload) {
                const doc = {
                    ...payload,
                    id: Date.now().toString(),
                    timestamp: new Date().toISOString()
                };
                this.data.unshift(doc);
                if (this.data.length > 50) this.data.pop();
                localStorage.setItem('mock_inventory_db', JSON.stringify(this.data));
                this.listeners.forEach(cb => cb(this.data));
                return Promise.resolve();
            }

            orderBy() { return this; }
            limit() { return this; }

            onSnapshot(cb) {
                this.listeners.push(cb);
                cb(this.data);
                return () => {};
            }
        }

        // ==========================================
        // 2. VARIABEL GLOBAL & STATE
        // ==========================================
        let model = null;
        let isCameraOn = false;
        let isAIDetecting = false;
        let lastSaveTime = 0;
        const SAVE_THROTTLE_MS = 3000; // Throttling: Simpan maksimal tiap 3 detik

        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const overlayMsg = document.getElementById('overlay-msg');
        const overlayText = document.getElementById('overlay-text');
        const overlaySubtext = document.getElementById('overlay-subtext');
        
        const dbStatusEl = document.getElementById('db-status');
        const aiStatusEl = document.getElementById('ai-status');
        const btnAI = document.getElementById('btn-ai');

        // DAFTAR BENDA YANG DIDETEKSI (Meja, Laptop, Phone, Clock, Mouse, Book, Glass/Cup, Chair, TV/Computer, dll.)
        const TARGET_CLASSES = [
            'laptop', 'tv', 'cell phone', 'mouse', 'keyboard', 
            'book', 'clock', 'cup', 'bottle', 'wine glass', 
            'dining table', 'chair', 'person', 'scissors', 'remote'
        ];

        // Pemetaan Terjemahan Nama Benda Ke Bahasa Indonesia untuk Tampilan
        const CLASS_TRANSLATIONS = {
            'laptop': 'Laptop',
            'tv': 'Komputer / Monitor',
            'cell phone': 'Smartphone',
            'mouse': 'Mouse',
            'keyboard': 'Keyboard',
            'book': 'Buku / Catatan',
            'clock': 'Jam',
            'cup': 'Cangkir / Gelas',
            'bottle': 'Botol',
            'wine glass': 'Gelas Kaca',
            'dining table': 'Meja',
            'chair': 'Kursi',
            'person': 'Orang',
            'scissors': 'Gunting / Alat Tulis',
            'remote': 'Remote / Aksesori Kecil'
        };

        // ==========================================
        // 3. KONFIGURASI DATABASE
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyDn_QM2U6k2WHucsqIWbQZU5gpjScm7IpY",
            authDomain: "expense-tracker-mahasisw-3a4e1.firebaseapp.com",
            projectId: "expense-tracker-mahasisw-3a4e1",
            storageBucket: "expense-tracker-mahasisw-3a4e1.firebasestorage.app",
            messagingSenderId: "295980348188",
            appId: "1:295980348188:web:e0168747f62f9315bc80d9"
        };

        let db;
        let collectionRef;
        let isMockMode = true;

        if (firebaseConfig.apiKey && firebaseConfig.projectId) {
            try {
                const app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                collectionRef = collection(db, "inventory");
                isMockMode = false;
                dbStatusEl.textContent = "DB: FIREBASE ONLINE";
                dbStatusEl.className = "status-badge online";
            } catch (e) {
                console.error("Firebase init error", e);
            }
        }

        if (isMockMode) {
            db = new MockFirestore();
            collectionRef = db;
            dbStatusEl.textContent = "DB: DEMO MODE (LOCAL)";
            dbStatusEl.className = "status-badge demo";
        }

        // ==========================================
        // 4. MEMUAT MODEL AI (COCO-SSD)
        // ==========================================
        async function loadModel() {
            try {
                // Menggunakan base mobilenet_v2 untuk tingkat akurasi yang lebih tinggi
                model = await cocoSsd.load({ base: 'mobilenet_v2' });
                overlayMsg.style.display = 'none';
                aiStatusEl.textContent = "AI: READY";
                aiStatusEl.className = "status-badge online";
                btnAI.disabled = false;
                console.log("Model AI berhasil dimuat:", model);
            } catch (err) {
                console.error("Gagal memuat model:", err);
                overlayText.textContent = "Gagal Memuat Model AI";
                overlaySubtext.textContent = "Pastikan koneksi internet aktif saat membuka halaman.";
            }
        }

        // ==========================================
        // 5. KONTROL KAMERA
        // ==========================================
        async function startCamera() {
            try {
                overlayMsg.style.display = 'flex';
                overlayText.textContent = 'Menghubungkan Kamera...';
                overlaySubtext.textContent = '';

                const stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: 'environment',
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    },
                    audio: false
                });

                video.srcObject = stream;

                await new Promise(resolve => {
                    video.onloadedmetadata = () => {
                        canvas.width = video.videoWidth;
                        canvas.height = video.videoHeight;
                        resolve();
                    };
                });

                isCameraOn = true;
                if (model) overlayMsg.style.display = 'none';
            } catch (err) {
                console.error("Gagal akses kamera:", err);
                overlayText.textContent = "Gagal Akses Kamera";
                overlaySubtext.textContent = "Pastikan izin kamera diberikan di browser.";
            }
        }

        function stopCamera() {
            if (video.srcObject) {
                video.srcObject.getTracks().forEach(track => track.stop());
                video.srcObject = null;
            }
            isCameraOn = false;
            isAIDetecting = false;
            btnAI.textContent = "Start AI";
            btnAI.className = "btn-ai btn-success";
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        // ==========================================
        // 6. SIMPAN HASIL DETEKSI KE DATABASE
        // ==========================================
        async function saveToDatabase(data) {
            try {
                const itemsString = data.map(d => `${d.displayName} (${d.confidence}%)`).join(', ');

                const payload = {
                    items: itemsString,
                    count: data.length,
                    device_id: 'BROWSER-TEST',
                    timestamp: isMockMode ? new Date().toISOString() : serverTimestamp()
                };

                if (isMockMode) {
                    await collectionRef.add(payload);
                } else {
                    await addDoc(collectionRef, payload);
                }
            } catch (err) {
                console.error("Gagal menyimpan data:", err);
            }
        }

        // ==========================================
        // 7. REAL-TIME LISTENER ON SNAPSHOT
        // ==========================================
        function listenToDatabase() {
            let handleSnapshot = (snapshot) => {
                const dataList = document.getElementById('data-list');
                dataList.innerHTML = '';

                let count = 0;
                const docs = isMockMode ? snapshot : snapshot.docs;

                if (docs && docs.length > 0) {
                    docs.forEach(doc => {
                        count++;
                        const data = isMockMode ? doc : doc.data();

                        let timeStr;
                        if (data.timestamp) {
                            const date = isMockMode ? new Date(data.timestamp) : data.timestamp.toDate();
                            timeStr = date ? date.toLocaleTimeString('id-ID') : 'Baru saja';
                        } else {
                            timeStr = 'Baru saja';
                        }

                        const div = document.createElement('div');
                        div.className = 'log-item';
                        div.innerHTML = `
                            <span class="time">${timeStr}</span>
                            <span class="items">${data.items || 'Objek terdeteksi'}</span>
                        `;
                        dataList.appendChild(div);
                    });
                }

                document.getElementById('log-count').textContent = `${count} items`;

                if (count === 0) {
                    dataList.innerHTML = '<div class="empty-state">Belum ada objek terdeteksi</div>';
                }
            };

            if (isMockMode) {
                collectionRef.onSnapshot(handleSnapshot);
            } else {
                const q = query(collectionRef, orderBy("timestamp", "desc"), limit(30));
                onSnapshot(q, handleSnapshot);
            }
        }

        // ==========================================
        // 8. DETECTION LOOP & BOUNDING BOX
        // ==========================================
        async function detectLoop() {
            if (!isAIDetecting || !isCameraOn) return;

            // Deteksi frame dari video
            const predictions = await model.detect(video);
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            let detectedTargets = [];

            predictions.forEach(pred => {
                const [x, y, w, h] = pred.bbox;
                const confidence = pred.score;
                
                // Jika TARGET_CLASSES diatur, filter sesuai target. Jika tidak, izinkan semua.
                const isTarget = TARGET_CLASSES.length === 0 || TARGET_CLASSES.includes(pred.class);

                // Menggunakan threshold confidence > 35% agar benda lebih mudah terdeteksi
                if (isTarget && confidence > 0.35) {
                    const displayName = CLASS_TRANSLATIONS[pred.class] || pred.class;

                    detectedTargets.push({
                        class: pred.class,
                        displayName: displayName,
                        confidence: parseFloat((confidence * 100).toFixed(0))
                    });

                    // Gambar Kotak Penanda
                    ctx.strokeStyle = '#10b981';
                    ctx.lineWidth = 3;
                    ctx.strokeRect(x, y, w, h);

                    // Gambar Label Nama Benda
                    const label = `${displayName} ${(confidence * 100).toFixed(0)}%`;
                    ctx.fillStyle = '#10b981';
                    const textWidth = ctx.measureText(label).width;
                    
                    const labelY = y > 25 ? y - 25 : y;
                    ctx.fillRect(x, labelY, textWidth + 10, 25);

                    ctx.fillStyle = '#ffffff';
                    ctx.font = 'bold 13px sans-serif';
                    ctx.fillText(label, x + 5, labelY + 17);
                }
            });

            // THROTTLING: Simpan ke database jika ada objek terdeteksi & sudah lewat 3 detik
            if (detectedTargets.length > 0 && (Date.now() - lastSaveTime > SAVE_THROTTLE_MS)) {
                saveToDatabase(detectedTargets);
                lastSaveTime = Date.now();
            }

            requestAnimationFrame(detectLoop);
        }

        // ==========================================
        // 9. INISIALISASI APLIKASI
        // ==========================================
        function initApp() {
            listenToDatabase();
            loadModel();
        }

        // Event Listeners
        document.getElementById('btn-start').addEventListener('click', startCamera);
        document.getElementById('btn-stop').addEventListener('click', stopCamera);

        btnAI.addEventListener('click', () => {
            if (!isCameraOn) {
                alert("Nyalakan kamera terlebih dahulu!");
                return;
            }

            if (!isAIDetecting) {
                isAIDetecting = true;
                btnAI.textContent = "Stop AI";
                btnAI.className = "btn-ai btn-danger";
                detectLoop();
            } else {
                isAIDetecting = false;
                btnAI.textContent = "Start AI";
                btnAI.className = "btn-ai btn-success";
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            }
        });

        document.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
